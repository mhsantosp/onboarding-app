<form class="space-y-3" (submit)="onSubmit($event)">
  <div class="flex flex-col">
    <label for="documentType" class="text-sm font-medium text-slate-700 mb-1">
      Tipo documento
    </label>
    <select
      id="documentType"
      class="border border-slate-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 bg-white"
    >
      <option value="">Selecciona un tipo</option>
      <option value="CC">CC</option>
      <option value="CE">CE</option>
      <option value="PAS">PAS</option>
    </select>
    @if (errors.documentType) {
      <p class="mt-1 text-xs text-red-600">
        {{ errors.documentType }}
      </p>
    }
  </div>

  <div class="flex flex-col">
    <label for="documentNumber" class="text-sm font-medium text-slate-700 mb-1">
      Número documento
    </label>
    <input
      id="documentNumber"
      type="text"
      class="border border-slate-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
    />
    @if (errors.documentNumber) {
      <p class="mt-1 text-xs text-red-600">
        {{ errors.documentNumber }}
      </p>
    }
  </div>

  <div class="flex flex-col">
    <label for="fullName" class="text-sm font-medium text-slate-700 mb-1">
      Nombre completo
    </label>
    <input
      id="fullName"
      type="text"
      class="border border-slate-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
    />
    @if (errors.fullName) {
      <p class="mt-1 text-xs text-red-600">
        {{ errors.fullName }}
      </p>
    }
  </div>

  <div class="flex flex-col">
    <label for="email" class="text-sm font-medium text-slate-700 mb-1">
      Email
    </label>
    <input
      id="email"
      type="email"
      class="border border-slate-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
    />
    @if (errors.email) {
      <p class="mt-1 text-xs text-red-600">
        {{ errors.email }}
      </p>
    }
  </div>

  <button
    type="submit"
    class="mt-2 inline-flex items-center justify-center rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-1"
  >
    Crear cliente
  </button>
</form>
