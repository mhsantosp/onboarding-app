@if (customers.length > 0) {
  <table>
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Documento</th>
        <th>Nombre</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      @for (c of customers; track c.documentNumber) {
        <tr>
          <td>{{ c.documentType }}</td>
          <td>{{ c.documentNumber }}</td>
          <td>{{ c.fullName }}</td>
          <td>{{ c.email }}</td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p>No hay clientes todavía.</p>
}
