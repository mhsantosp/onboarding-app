@if (customers.length > 0) {
  <div class="space-y-3">
    <div class="flex flex-col">
      <label for="customerSelect" class="text-sm font-medium text-slate-700 mb-1">
        Cliente
      </label>
      <select
        id="customerSelect"
        [(ngModel)]="selectedDocumentNumber"
        name="customerSelect"
        class="border border-slate-300 rounded-md px-2 py-1 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      >
        <option [ngValue]="null">Selecciona un cliente</option>
        @for (c of customers; track c.documentNumber) {
          <option [ngValue]="c.documentNumber">
            {{ c.fullName }} ({{ c.documentType }} {{ c.documentNumber }})
          </option>
        }
      </select>
    </div>

    <button
      type="button"
      (click)="onCreateAccount()"
      class="inline-flex items-center justify-center rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1"
    >
      Crear cuenta
    </button>

    @if (message && messageType === 'error') {
      <p class="text-sm text-red-600 mt-1">
        {{ message }}
      </p>
    }
    @if (message && messageType === 'success') {
      <p class="text-sm text-emerald-700 mt-1">
        {{ message }}
      </p>
    }
  </div>
} @else {
  <p class="text-sm text-slate-500">
    No hay clientes para crear cuentas.
  </p>
}
